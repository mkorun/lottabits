name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned Go version
        id: go
        run: echo "version=$(sed -nE 's/^go = "([^"]+)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: Install pinned golangci-lint
        run: |
          version="$(sed -nE 's/^golangci-lint = "([^"]+)"/\1/p' mise.toml)"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${version}"
      - name: Gate
        run: sh scripts/check.sh
      - name: Reproducible build
        run: sh scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Layout check of the printables
        run: |
          go run ./cmd/printables -layout-check -out "$RUNNER_TEMP/layout"
          python3 tools/check_layout.py "$RUNNER_TEMP/layout"
      - name: PDFs of the printables (convenience, not reproducible)
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          go run ./cmd/printables -version "$GITHUB_REF_NAME" -out "$RUNNER_TEMP/printables"
          python3 tools/render_pdfs.py "$RUNNER_TEMP/printables" "$RUNNER_TEMP/pdf-$GITHUB_REF_NAME"
          python3 tools/release_archive.py "$RUNNER_TEMP/pdf-$GITHUB_REF_NAME" "dist/release/lottabits-$GITHUB_REF_NAME-printables-pdf.zip"
          (cd dist/release && sha256sum "lottabits-$GITHUB_REF_NAME-printables-pdf.zip" >> SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/lottabits-*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -n "/^## \[$version\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --title "LottaBits $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease
